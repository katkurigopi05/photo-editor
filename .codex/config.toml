#:schema https://developers.openai.com/codex/config-schema.json

# ECC Tools generated Codex baseline
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@latest"]

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp"

[mcp_servers.memory]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-memory"]

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest", "--extension"]

[mcp_servers.sequential-thinking]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]

# Gives Codex the same command-driven editing surface the web app uses: every
# change to a project goes through a validated command with an exact inverse,
# attributed in the operation log and reversible with Undo. An agent editing
# .director.json as text would bypass validation, canonical serialization and
# history all at once — this is what stops that being the easy path.
#
# `--root` is a containment boundary the server already enforces: every project
# path must stay inside it. It is deliberately a narrow directory rather than
# the checkout root, and director-projects/ is gitignored.
#
# Paths are relative, so Codex must be launched at the checkout root. dist/ is
# gitignored, so a fresh clone has nothing to run until:
#   pnpm --filter @director/mcp-server build
[mcp_servers.director]
command = "node"
args = [
  "packages/mcp-server/dist/index.js",
  "--root", "director-projects",
  "--actor", "mcp:codex",
]

# Serves the knowledge graph built by /graphify. The graph path is omitted so it
# defaults to graphify-out/graph.json relative to the project, rather than being
# pinned to one checkout. graphify-out/ is gitignored — run /graphify once before
# this server has anything to read. `command` is the interpreter that has graphify
# installed; change it if yours lives elsewhere.
[mcp_servers.graphify]
command = "/opt/miniconda3/bin/python3.13"
args = ["-m", "graphify.serve"]

[features]
multi_agent = true

[agents]
max_threads = 6
max_depth = 1

[agents.explorer]
description = "Read-only codebase explorer for gathering evidence before changes are proposed."
config_file = "agents/explorer.toml"

[agents.reviewer]
description = "PR reviewer focused on correctness, security, and missing tests."
config_file = "agents/reviewer.toml"

[agents.docs_researcher]
description = "Documentation specialist that verifies APIs, framework behavior, and release notes."
config_file = "agents/docs-researcher.toml"
