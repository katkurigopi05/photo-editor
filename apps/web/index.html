<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Director — Editor</title>
    <link rel="stylesheet" href="/src/index.css" />
    <script>
      // Apply the persisted theme before first paint, to avoid a flash of the
      // wrong theme. "system" resolves via prefers-color-scheme.
      (function () {
        var stored = localStorage.getItem("director-theme") || "system";
        var resolved =
          stored === "system"
            ? window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark"
            : stored;
        document.documentElement.setAttribute("data-theme", resolved);
        document.documentElement.setAttribute("data-theme-pref", stored);
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="top-left">
          <span class="logo">🎬 Project Director</span>
          <div class="mode-switch" role="tablist">
            <button id="mode-photo" class="mode-btn active">Photo</button>
            <button id="mode-video" class="mode-btn">Video</button>
          </div>
        </div>
        <div class="top-center">
          <span id="timecode" class="timecode">00:00.000</span>
          <span id="version-badge" class="badge">v0</span>
        </div>
        <div class="top-right">
          <div class="theme-switch" role="tablist" aria-label="Theme">
            <button id="theme-light" class="theme-btn" title="Light theme">
              ☀
            </button>
            <button id="theme-dark" class="theme-btn" title="Dark theme">
              ●
            </button>
            <button id="theme-system" class="theme-btn" title="Match system">
              ◐
            </button>
          </div>
          <div class="theme-picker">
            <button
              id="btn-theme-picker"
              class="tool"
              title="Color theme"
              aria-haspopup="true"
              aria-expanded="false"
            >
              🎨
            </button>
            <div id="theme-panel" class="theme-panel hidden">
              <div class="theme-panel-title">Color theme</div>
              <div id="theme-preset-grid" class="theme-preset-grid"></div>
              <div id="theme-custom-list" class="theme-custom-list"></div>
              <button id="btn-theme-new" class="mini theme-new-btn">
                ＋ Custom theme…
              </button>
              <form id="theme-form" class="theme-form hidden">
                <input
                  id="theme-name"
                  class="theme-name-input"
                  type="text"
                  placeholder="Theme name"
                  maxlength="24"
                  required
                />
                <div class="theme-seed-row">
                  <label>Background<input
                      id="seed-bg"
                      type="color"
                      value="#14161f"
                  /></label>
                  <label>Panel<input
                      id="seed-panel"
                      type="color"
                      value="#1c202c"
                  /></label>
                  <label>Text<input
                      id="seed-text"
                      type="color"
                      value="#eef1f6"
                  /></label>
                  <label>Accent<input
                      id="seed-accent"
                      type="color"
                      value="#7c5cff"
                  /></label>
                </div>
                <div class="theme-form-actions">
                  <button type="button" id="btn-theme-cancel" class="mini">
                    Cancel
                  </button>
                  <button type="submit" class="tool primary theme-save-btn">
                    Save theme
                  </button>
                </div>
              </form>
            </div>
          </div>
          <button id="btn-undo" class="tool" title="Undo (Cmd/Ctrl+Z)">
            ↶ Undo
          </button>
          <button id="btn-redo" class="tool" title="Redo (Cmd/Ctrl+Shift+Z)">
            ↷ Redo
          </button>
          <button id="btn-export" class="tool primary">⤓ Export</button>
        </div>
      </header>

      <main id="workspace">
        <!-- LEFT: media bin + history -->
        <aside id="left-panel" class="panel">
          <div class="panel-title">Media</div>
          <button id="btn-import" class="import-btn">＋ Import media…</button>
          <input
            id="file-input"
            type="file"
            accept="image/*,video/*,audio/*"
            hidden
          />
          <div id="media-list" class="media-list"></div>
          <div class="panel-title">Effects &amp; Filters</div>
          <div id="effects-palette" class="effects-palette"></div>
          <div class="panel-title">History</div>
          <div id="history-list" class="history-list"></div>
        </aside>

        <!-- CENTER: preview + transport -->
        <section id="center-panel" class="panel">
          <div id="stage" class="stage">
            <canvas id="preview"></canvas>
            <div id="stage-empty" class="stage-empty">
              Import media, then add it to the timeline to preview.
            </div>
            <div id="raster-rail" class="raster-rail hidden"></div>
          </div>
          <div class="transport">
            <button id="btn-start" class="tool" title="Go to start">⏮</button>
            <button id="btn-prev" class="tool" title="Previous frame">
              ◀|
            </button>
            <button id="btn-play" class="tool play">▶</button>
            <button id="btn-next" class="tool" title="Next frame">|▶</button>
            <input
              id="seek"
              class="seek"
              type="range"
              min="0"
              max="1000"
              value="0"
            />
            <span id="duration" class="duration">/ 00:00.000</span>
          </div>
        </section>

        <!-- RIGHT: inspector -->
        <aside id="right-panel" class="panel">
          <div class="panel-title">Inspector</div>
          <div id="inspector" class="inspector">
            <p class="hint">Select a clip to edit its effects and audio.</p>
          </div>
        </aside>
      </main>

      <!-- BOTTOM: timeline -->
      <footer id="timeline" class="panel">
        <div class="timeline-toolbar">
          <button id="btn-add-track" class="tool">＋ Track</button>
          <button id="btn-split" class="tool">✂ Split</button>
          <button id="btn-delete" class="tool danger">🗑 Delete</button>
          <span class="spacer"></span>
          <label class="zoom"
            >Zoom
            <input id="zoom" type="range" min="20" max="400" value="120" />
          </label>
        </div>
        <div id="timeline-body" class="timeline-body"></div>
      </footer>
    </div>
    <div id="drop-overlay" class="drop-overlay hidden">
      <div class="drop-card">⤓ Drop media to import</div>
    </div>
    <div id="toast" class="toast hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
