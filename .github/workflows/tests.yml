name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt

      # requirements-dev.txt pulls in the core (Pillow), the OpenCV/NumPy
      # extras and MoviePy. MoviePy brings its own FFmpeg via imageio-ffmpeg,
      # so no system FFmpeg install is needed. The heaviest optional extras
      # (requirements-ai.txt: torch/transformers) are deliberately excluded —
      # their tests skip automatically when the deps are absent.
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt

      # The suite is headless by design: the Tkinter GUI is never launched,
      # so no display server is required on the runner.
      - name: Run tests
        run: pytest -q
